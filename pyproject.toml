[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "longhorizon-guard"
version = "0.2.0"
description = "Long-horizon agent error mitigation system: taxonomy, tagger, pattern library, and drift monitor."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]
langchain = [
    "langchain-core>=0.1.0",
]

[project.scripts]
longhorizon-guard = "longhorizon_guard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["longhorizon_guard*"]

[tool.setuptools.package-data]
"longhorizon_guard" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scratch", "eval", "harness", "build", "dist", ".git"]

