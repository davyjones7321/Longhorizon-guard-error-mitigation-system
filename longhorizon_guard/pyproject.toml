[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "longhorizon-guard"
version = "0.1.0"
description = "Long-horizon agent error mitigation system: taxonomy, tagger, pattern library, and drift monitor."
readme = "../README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
longhorizon-guard = "longhorizon_guard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["longhorizon_guard*"]

